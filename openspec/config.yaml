schema: spec-driven

# Project context is shown to AI when creating artifacts.
context: |
  Product: Lumo — AI-native managed business operations for small independent
  merchants in Mexico. Initial language Spanish, currency MXN. Pilot: Carrota.

  Authoritative sources (in this order for implementation of Build A):
  1. docs/PRD_Lumo_MVP_Build_A_v1.0.md
  2. docs/SRS_Lumo_MVP_Build_A_v1.0.md
  3. docs/Technical_Architecture_Lumo_MVP_Build_A_v1.0.md
  4. docs/LUMO_DESIGN_SYSTEM_v1.0.md
  5. docs/PRD_Lumo_AI_Native_Managed_Business_Operations_v0.11.md (product vision;
     Build A v1.0 supersedes 0.11 where they conflict on MVP scope)

  Baseline:
  - Change `build-a-core-foundation` is archived and complete.
  - Change `build-a-conversational-sale-foundation` is archived and complete.
  - Change `build-a-conversational-sale-session` is archived and complete.
  - Change `build-a-sale-payment-and-completion` is archived and complete.
  - There is no active OpenSpec change.
  - Baseline OpenSpec specs under openspec/specs/ include foundation capabilities
    (backend-platform, persistence, tenant-isolation, integrity-foundation,
    ai-native-contracts, mobile-shell, lumo-design-system) plus catalog-foundation,
    sales-session-foundation, conversational-sale-runtime, sale-item-added-ui,
    conversational-sale-session, sale-summary-ui, sale-payment, and
    sale-confirmed-ui.
  - Registered tools: `catalog.resolve_product@1`, `sale.start@1`,
    `sale.add_item@1`, `sale.totalize@1`, `sale.commit@1`.
    Registered UI: `sale_item_added@1`, `sale_summary@1`, `sale_confirmed@1`.
  - `SaleSession.status` is `open`, `ready_to_charge`, or `confirmed`.
    `ready_to_charge` is a pre-payment state. `confirmed` is operational completion
    with one recorded `Payment` in `sales.payments`.
  - Product changes MAY introduce closing or export logic when that
    logic is explicitly owned by an approved OpenSpec change.
  - Tasks and specs MUST stay within an approved change's goals and non-goals.
    Do not implement adjacent Build A capabilities just because the PRD lists them.

  Stack:
  - Backend: Python 3.12, FastAPI, Pydantic v2, SQLAlchemy 2, Alembic, PostgreSQL
  - Mobile: Flutter, Dart
  - Deploy: Docker, docker-compose (api + postgres locally; no worker until a real async consumer exists)
  - Architecture: modular monolith; dependencies point inward to domain
  - Persistence: PostgreSQL is the system of record
  - Local Compose: PostgreSQL container listens on 5432 internally and MUST be
    published to the host as 5432:5432 (localhost:5432). Do not document or
    default host mappings to 5433.
  - Foundation schemas present: identity, audit, platform
  - Product schemas present: catalog, sales
  - Product schemas still absent: operations, workflow, memory
  - Money: numeric/Decimal only; never binary float; server-side deterministic calc
  - IDs: UUIDv7; timestamps timestamptz UTC; operational date in business timezone
  - API: /api/v1, JSON UTF-8 snake_case, error envelope per SRS 8.5

  Repository layout (target):
    backend/app/{api,agent,application,domain,infrastructure,policies,bootstrap}
    backend/app/application/{commands,queries,workflows}
    backend/migrations, backend/tests
    mobile/lib/{app,core,api,lumo,features,shared}

  Architectural constraints (non-negotiable):
  - LLM never mutates domain state; never accesses repositories or DB credentials
  - All mutations go through registered deterministic tools / application services
  - Flutter contains no domain/business calculations and is the only GenerativeUIRenderer
  - Backend GenerativeUIRegistry/GenerativeUIComposer emit only registered versioned UI contracts
  - ToolRegistry and GenerativeUIRegistry remain closed catalogs; only register
    what the active change specifies
  - One Lumo Orchestrator in Build A, not multiple independent agents
  - Keep modular monolith; no Redis, Kafka, microservices, or vector database
  - Do not implement inventory, purchasing, replenishment, forecasting, invoicing,
    banking reconciliation, ecommerce, CRM, or multi-branch
  - Preserve visual identity from LUMO_DESIGN_SYSTEM_v1.0.md; do not redesign Lumo
  - Domain must not import FastAPI, SQLAlchemy models, LLM SDKs, or Flutter types
  - Tenant isolation: shared schema with business_id on every business entity;
    TenantContext is derived from the authenticated session, never from client choice

# Per-artifact rules
rules:
  proposal:
    - Keep proposals under 800 words
    - Always include a "Non-goals" section
    - Cite authoritative docs when a decision is inherited, not invented
  specs:
    - Requirements must be verifiable
    - Specs MUST stay within the active change's stated scope and non-goals
    - Product feature logic (catalog, sales, payment, closing, export) MAY be
      specified when the approved change owns that capability
    - Do not retain or invent a rule that all product feature logic is forbidden
  design:
    - Resolve directory-structure conflicts explicitly
    - Record ADRs that this change establishes or prepares
    - Do not introduce infrastructure forbidden by Build A architecture
    - Do not weaken LLM non-mutation, deterministic server-side calculation,
      Flutter no-domain-math, single orchestrator, tenant isolation, or closed
      tool/UI registries
  tasks:
    - Break tasks into chunks of max 2 hours
    - Tasks MUST stay within the scope of the active change
    - Product feature logic MAY be implemented when the active change owns it
    - Do not implement capabilities listed in the change's Non-goals
